name: Native media contract

on:
  workflow_dispatch:
  push:
    branches: [rewrite]
    paths:
      - Cargo.lock
      - crates/crfty-core/src/**
      - crates/crfty-engine/Cargo.toml
      - crates/crfty-engine/src/**
      - crates/crfty-engine/tests/**
      - .github/workflows/media-contract.yml
  pull_request:
    branches: [rewrite]
    paths:
      - Cargo.lock
      - crates/crfty-core/src/**
      - crates/crfty-engine/Cargo.toml
      - crates/crfty-engine/src/**
      - crates/crfty-engine/tests/**
      - .github/workflows/media-contract.yml

permissions:
  contents: read

# FFmpeg is user-supplied in the product (ADR-023); these suites need a real
# build with libsvtav1 and libvmaf, so the job installs BtbN's rolling n8.1
# release at run time. The release tag is stable while its bytes advance,
# which is why no checksum or cache is kept: the suites verify behaviour, not
# an artifact.
env:
  FFMPEG_RELEASE_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

jobs:
  media-contract:
    name: Real FFmpeg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "$FFMPEG_RELEASE_BASE/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          mkdir -p .ci/ffmpeg
          tar --extract --xz --file "$archive" --directory .ci/ffmpeg --strip-components=1
          .ci/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri "$env:FFMPEG_RELEASE_BASE/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract
          New-Item -ItemType Directory -Force -Path .ci/ffmpeg | Out-Null
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          Move-Item -Path (Join-Path $root.FullName '*') -Destination .ci/ffmpeg
          & .ci/ffmpeg/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Run real-media contract on Linux
        if: runner.os == 'Linux'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
        run: cargo test -p crfty-engine --all-features --locked --test ab_av1_real_media -- --ignored --nocapture
      - name: Run real-media contract on Windows
        if: runner.os == 'Windows'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg.exe
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe.exe
        run: cargo test -p crfty-engine --all-features --locked --test ab_av1_real_media -- --ignored --nocapture
      # The native tool contract copies these binaries into a spaces + Unicode
      # directory, configures them through Settings paths with no PATH, and
      # runs the session-start probe plus a full convert from there; the env
      # vars only locate the source binaries.
      - name: Run native tool contract on Linux
        if: runner.os == 'Linux'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
        run: cargo test -p crfty-engine --all-features --locked --test tools_native -- --ignored --nocapture
      - name: Run native tool contract on Windows
        if: runner.os == 'Windows'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg.exe
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe.exe
        run: cargo test -p crfty-engine --all-features --locked --test tools_native -- --ignored --nocapture
