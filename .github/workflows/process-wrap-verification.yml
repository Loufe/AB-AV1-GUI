name: Published process-wrap verification

on:
  push:
    branches: [fix/process-wrap-verification]
  pull_request:
    branches: [fix/process-wrap-verification]

env:
  FFMPEG_RELEASE_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Extract unpublished ab-av1 contribution for verification
        shell: bash
        run: |
          mkdir -p .ci/ab-av1
          tar -xzf .ci/ab-av1-verification.tar.gz -C .ci/ab-av1
          printf '\n[workspace]\n' >> .ci/ab-av1/Cargo.toml
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Select stable Rust
        run: rustup default stable
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reject Rust lint allowances
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if git grep -n -E '(^|[^[:alnum:]_])allow[[:space:]]*\(' -- ':(glob)crates/**/*.rs'; then
            echo 'Rust lint allowances are forbidden; use a narrow #[expect(..., reason = "...")] instead.'
            exit 1
          fi
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked -- --skip pinned_revision_matches_the_workspace_lockfile --test-threads=4
      - name: Check generated artifact freshness
        run: git diff --exit-code -- ui/src/lib/bindings.ts ui/src/lib/store/fold-fixtures.json ui/src/lib/store/analysis-fixtures.json ui/src/lib/projection/projection-fixtures.json

      - name: Check the ab-av1 contribution
        run: cargo clippy --manifest-path .ci/ab-av1/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test the ab-av1 contribution
        run: cargo test --manifest-path .ci/ab-av1/Cargo.toml --all-features --locked
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "$FFMPEG_RELEASE_BASE/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"
          mkdir -p .ci/ffmpeg
          tar --extract --xz --file "$archive" --directory .ci/ffmpeg --strip-components=1
          .ci/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
          Invoke-WebRequest -Uri "$env:FFMPEG_RELEASE_BASE/ffmpeg-n8.1-latest-win64-gpl-8.1.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract
          New-Item -ItemType Directory -Force -Path .ci/ffmpeg | Out-Null
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          Move-Item -Path (Join-Path $root.FullName '*') -Destination .ci/ffmpeg
          & .ci/ffmpeg/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Run real-media contract on Linux
        if: runner.os == 'Linux'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
        run: cargo test -p crfty-engine --all-features --locked --test ab_av1_real_media -- --ignored --nocapture
      - name: Run real-media contract on Windows
        if: runner.os == 'Windows'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg.exe
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe.exe
        run: cargo test -p crfty-engine --all-features --locked --test ab_av1_real_media -- --ignored --nocapture
      # The native tool contract copies these binaries into a spaces + Unicode
      # directory, configures them through Settings paths with no PATH, and
      # runs the session-start probe plus a full convert from there; the env
      # vars only locate the source binaries.
      - name: Run native tool contract on Linux
        if: runner.os == 'Linux'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
        run: cargo test -p crfty-engine --all-features --locked --test tools_native -- --ignored --nocapture
      - name: Run native tool contract on Windows
        if: runner.os == 'Windows'
        env:
          CRFTY_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg.exe
          CRFTY_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe.exe
        run: cargo test -p crfty-engine --all-features --locked --test tools_native -- --ignored --nocapture
