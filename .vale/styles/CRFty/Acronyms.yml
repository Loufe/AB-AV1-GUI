extends: conditional
message: "Define '%s' on first use or add a familiar project term to the rule exceptions."
level: error
ignorecase: false
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
exceptions:
